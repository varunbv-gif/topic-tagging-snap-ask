<title>Snap-and-Ask Topic Mapping</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#f3f5f4; --surface:#fff; --surface-2:#f8faf9; --raise:#fff;
  --ink:#161b1a; --muted:#5d6968; --faint:#87918f;
  --rule:#e0e5e3; --rule-soft:#edf0ef;
  --accent:#0d6e63; --accent-soft:#e3f1ef; --accent-ink:#0a5750;
  --high:#0f7a52; --high-soft:#e4f3ec;
  --med:#8f6200;  --med-soft:#f8efdc;
  --low:#a33a12;  --low-soft:#fbeae3;
  --off:#6b7280;  --off-soft:#eceef0;
  --sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --disp:"Bricolage Grotesque",-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#111614; --surface:#191f1d; --surface-2:#1d2422; --raise:#212927;
  --ink:#e6ecea; --muted:#96a3a0; --faint:#74807e;
  --rule:#2a3331; --rule-soft:#222a28;
  --accent:#4fbfae; --accent-soft:#16302d; --accent-ink:#6fd3c3;
  --high:#4cc48b; --high-soft:#122c20;
  --med:#d3a13a;  --med-soft:#2e2413;
  --low:#e0744a;  --low-soft:#301c14;
  --off:#8b949e;  --off-soft:#242a2e;
}}
:root[data-theme="dark"]{
  --ground:#111614; --surface:#191f1d; --surface-2:#1d2422; --raise:#212927;
  --ink:#e6ecea; --muted:#96a3a0; --faint:#74807e;
  --rule:#2a3331; --rule-soft:#222a28;
  --accent:#4fbfae; --accent-soft:#16302d; --accent-ink:#6fd3c3;
  --high:#4cc48b; --high-soft:#122c20;
  --med:#d3a13a;  --med-soft:#2e2413;
  --low:#e0744a;  --low-soft:#301c14;
  --off:#8b949e;  --off-soft:#242a2e;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;margin:0}
h1,h2{font-family:var(--disp);margin:0;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:clamp(26px,4.4vw,38px);font-weight:700;line-height:1.08}
h2{font-size:15px;font-weight:600}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:18px;padding-right:18px;padding-block:36px 56px;
  display:flex;flex-direction:column;gap:26px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lede{color:var(--muted);max-width:64ch;font-size:16px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* headline figures */
.figs{display:flex;flex-wrap:wrap;gap:8px 30px;align-items:baseline;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding-block:16px}
.fig{display:flex;align-items:baseline;gap:8px}
.fig b{font-family:var(--disp);font-size:27px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.fig span{font-size:13px;color:var(--muted)}
.fig.k b{color:var(--accent)}

/* filter bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);
  padding-block:11px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:9px;
  margin-inline:-18px;padding-inline:18px}
.searchrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
input[type=search]{flex:1 1 220px;min-width:0;font-family:var(--sans);font-size:14.5px;color:var(--ink);
  background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:8px 11px}
input[type=search]:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.count{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:5px}
button.chip{font-family:var(--sans);font-size:12.5px;color:var(--muted);background:var(--surface);
  border:1px solid var(--rule);border-radius:99px;padding:3.5px 11px;cursor:pointer;line-height:1.35}
button.chip:hover{border-color:var(--accent);color:var(--ink)}
button.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
:root[data-theme="dark"] button.chip[aria-pressed=true],
:root:not([data-theme="light"]) button.chip[aria-pressed=true]{color:#06100f}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) button.chip[aria-pressed=true]{color:#fff}}
button.chip b{font-family:var(--mono);font-weight:400;opacity:.62;margin-left:5px;font-size:11px}

/* rows */
.list{display:flex;flex-direction:column;gap:7px}
.row{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;
  display:grid;grid-template-columns:1fr auto;gap:5px 16px;align-items:start}
.row.off{background:var(--surface-2);border-style:dashed}
.path{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 7px;font-size:14.5px}
.path .s{color:var(--muted)}
.path .c{color:var(--ink)}
.path .t{font-weight:600;color:var(--accent-ink)}
.path .sep{color:var(--faint);font-size:12px}
.path .t.none{font-weight:500;color:var(--muted);font-style:italic}
.meta{grid-column:1;display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--mono);font-size:11px;color:var(--faint)}
.meta .who{color:var(--muted)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  padding:2.5px 8px;border-radius:99px;white-space:nowrap;font-weight:500}
.t-HIGH{background:var(--high-soft);color:var(--high)}
.t-MED{background:var(--med-soft);color:var(--med)}
.t-LOW{background:var(--low-soft);color:var(--low)}
.t-off{background:var(--off-soft);color:var(--off)}
.tree{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.note{grid-column:1/-1;font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule-soft);
  padding-top:6px;margin-top:1px}
.empty{text-align:center;color:var(--muted);padding:44px 12px;font-size:15px}
footer{border-top:1px solid var(--rule);padding-top:20px;color:var(--faint);font-size:12.5px;
  display:flex;flex-direction:column;gap:5px}
footer code{font-family:var(--mono);font-size:11.5px}
@media (max-width:560px){
  .row{grid-template-columns:1fr}
  .side{flex-direction:row;align-items:center;justify-content:flex-start;gap:9px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
