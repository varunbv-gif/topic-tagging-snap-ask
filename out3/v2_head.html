<title>Snap-and-Ask Topic Mapping</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --plane:#f7f7f4; --surface:#fdfdfb; --sunk:#f1f1ec;
    --ink:#16160f; --ink-2:#56564c; --ink-3:#8a8a80;
    --rule:#e3e2db; --rule-2:#d2d1c8;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
    --track:#e8e7e0;
    --display:"Archivo","Helvetica Neue",Arial,sans-serif;
    --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
      color-scheme: dark;
      --plane:#0d0d0d; --surface:#1a1a19; --sunk:#232321;
      --ink:#f4f4ee; --ink-2:#c3c2b7; --ink-3:#8e8d84;
      --rule:#2e2e2b; --rule-2:#3d3d39;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
      --track:#2b2b28;
  } }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --sunk:#232321;
    --ink:#f4f4ee; --ink-2:#c3c2b7; --ink-3:#8e8d84;
    --rule:#2e2e2b; --rule-2:#3d3d39;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    --track:#2b2b28;
  }
  body { background: var(--plane); color: var(--ink);
    font: 400 15px/1.55 var(--body); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1080px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 60px; }
  h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing:-0.015em; text-wrap: balance; margin: 0; }
  h1 { font-size: clamp(30px, 5.2vw, 46px); line-height: 1.06; font-weight: 700; }
  h2 { font-size: 19px; } h3 { font-size: 15px; } p { margin: 0; }
  code { font-family: var(--mono); font-size:.88em; }
  .eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); }

  .mast { border-bottom: 2px solid var(--ink); padding-bottom: 20px; }
  .lede { margin-top: 12px; max-width: 64ch; color: var(--ink-2); font-size: 16px; }
  .lede b { color: var(--ink); font-weight:600; }

  .facts { display:grid; grid-template-columns: repeat(5, 1fr); gap:1px;
           background: var(--rule); border-top:2px solid var(--ink); border-bottom:1px solid var(--rule); }
  .fact { background: var(--plane); padding: 18px 4px 20px 0; }
  .fact .n { font-family: var(--display); font-weight:700; font-size: clamp(26px,4.4vw,36px);
             line-height:1; letter-spacing:-0.02em; }
  .fact .k { margin-top:7px; font:500 11px/1.35 var(--mono); letter-spacing:.09em;
             text-transform:uppercase; color: var(--ink-3); }
  .fact + .fact { padding-left: 18px; }

  section { margin-top: 44px; }
  .sechead { display:flex; align-items:baseline; justify-content:space-between; gap:16px;
             flex-wrap:wrap; margin-bottom:16px; }
  .sechead p { color: var(--ink-3); font-size:13px; max-width: 48ch; }

  .stack { display:flex; height: 44px; border-radius: 3px; overflow:hidden; background: var(--track); gap:2px; }
  .stack > div { position:relative; display:grid; place-items:center; min-width:2px; }
  .stack .lab { font:500 12px/1 var(--mono); color:#fff; letter-spacing:.02em; }
  .legend { display:flex; flex-wrap:wrap; gap:8px 22px; margin-top:14px; }
  .legend span { display:flex; align-items:center; gap:8px; font-size:13px; color: var(--ink-2); }
  .legend i { width:11px; height:11px; border-radius:2px; flex:none; }
  .legend b { color: var(--ink); font-weight:600; }

  .cols { display:grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .panel { background: var(--surface); border:1px solid var(--rule); border-radius:4px; padding: 20px 20px 22px; }
  .bars { display:grid; gap:11px; margin-top:16px; }
  .bar { display:grid; grid-template-columns: minmax(96px, 34%) 1fr auto; align-items:center; gap:12px; }
  .bar .name { font-size:13.5px; color: var(--ink-2); overflow-wrap:anywhere; }
  .bar .name.m { font-family:var(--mono); font-size:12px; }
  .bar .track { height:13px; background: var(--track); border-radius:2px; }
  .bar .fill { height:100%; background: var(--s1); border-radius: 0 4px 4px 0; min-width:2px; }
  .bar .v { font:500 13px/1 var(--mono); color: var(--ink); min-width: 34px; text-align:right; }
  .bar:hover .name { color: var(--ink); }

  .tablewrap { overflow-x:auto; }
  table { border-collapse: collapse; width:100%; font-size:13.5px; }
  th { text-align:left; font:500 10.5px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase;
       color: var(--ink-3); padding: 0 10px 9px 0; border-bottom:1px solid var(--rule-2); white-space:nowrap; }
  td { padding: 8px 10px 8px 0; border-bottom:1px solid var(--rule); vertical-align: middle; }
  tbody tr:hover td { background: var(--sunk); }
  td.rank { font:400 12px/1 var(--mono); color: var(--ink-3); width:26px; }
  td.tree { font:500 11.5px/1 var(--mono); color: var(--ink-2); white-space:nowrap; }
  td.ch { color: var(--ink); }
  td.subj { color: var(--ink-3); white-space:nowrap; font-size:12.5px; }
  td.n { font:500 13px/1 var(--mono); text-align:right; width:38px; }
  td.spark { width: 132px; min-width:96px; }
  td.spark div { height:11px; background: var(--s1); border-radius:0 4px 4px 0; min-width:2px; }

  .note { border-left:2px solid var(--s2); padding: 2px 0 2px 16px; color: var(--ink-2);
          font-size:14px; max-width: 70ch; }
  .note b { color: var(--ink); font-weight:600; }

  .scroller { max-height: 560px; overflow:auto; border:1px solid var(--rule);
              border-radius:4px; padding: 14px 16px 16px; background: var(--surface); }
  .scroller thead th { position: sticky; top:0; background: var(--surface); z-index:1; }
  .findbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .findbar input { flex:1 1 230px; min-width:0; font:400 14px var(--body); color:var(--ink);
    background:var(--surface); border:1px solid var(--rule-2); border-radius:3px; padding:8px 11px; }
  .findbar input:focus-visible, .findbar button:focus-visible { outline:2px solid var(--s1); outline-offset:1px; }
  .findbar .hits { font:500 12.5px/1 var(--mono); color:var(--ink-3); white-space:nowrap; }
  .findbar button { font:500 12px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-2); background:var(--surface); border:1px solid var(--rule-2); border-radius:3px;
    padding:8px 12px; cursor:pointer; }
  .findbar button:hover { color:var(--ink); border-color:var(--ink-3); }
  td.path { color: var(--ink); }
  td.path .s { color: var(--ink-3); font-size:12.5px; }
  td.path .t { font-weight:600; }
  td.path .t.none { font-weight:400; color: var(--ink-3); font-style:italic; }
  td.who { font:400 11.5px/1.5 var(--mono); color: var(--ink-3); white-space:nowrap; }
  td.cf { width:48px; }
  td.cf i { font-style:normal; font:500 10px/1 var(--mono); letter-spacing:.06em; padding:3px 6px;
    border-radius:2px; display:inline-block; }
  .cf-HIGH i { background: color-mix(in srgb, var(--s3) 16%, transparent); color: var(--s3); }
  .cf-MED  i { background: color-mix(in srgb, var(--s4) 20%, transparent); color: var(--s4); }
  .cf-LOW  i { background: color-mix(in srgb, var(--s2) 16%, transparent); color: var(--s2); }
  tr.off td.path { color: var(--ink-3); }

  #tip { position: fixed; z-index: 9; pointer-events:none; opacity:0; transition: opacity .1s;
         background: var(--ink); color: var(--plane); font:500 12px/1.4 var(--mono);
         padding: 6px 9px; border-radius:4px; white-space:nowrap; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 720px) {
    .cols { grid-template-columns: 1fr; gap: 28px; }
    .facts { grid-template-columns: repeat(2, 1fr); }
    .fact + .fact { padding-left: 0; }
    .fact:nth-child(even) { padding-left: 18px; }
    .bar { grid-template-columns: minmax(84px, 42%) 1fr auto; }
  }

  /* tree-grouped topic map */
  tr.tband td { padding: 22px 0 7px; border-bottom:1px solid var(--rule-2); }
  #map tr.tband:first-child td { padding-top: 2px; }
  tbody tr.tband:hover td { background: transparent; }
  tr.tband .tn { font:600 13px/1 var(--mono); color: var(--ink); letter-spacing:.02em; }
  tr.tband .ts { font:400 11.5px/1 var(--mono); color: var(--ink-3); margin-left:12px; }
  td.chap { color: var(--ink-3); font-size:12.5px; line-height:1.45; }
  td.chap em { font-style:normal; opacity:.72; }
  td.topic { color: var(--ink); }
  td.topic b { font-weight:600; }
  td.topic .none { color: var(--ink-3); font-style:italic; }
  td.topic .sub { font:400 11px/1 var(--mono); color: var(--ink-3); margin-left:6px; }
  td.n.dim { color: var(--ink-3); font-weight:400; }
  td.also { font:400 11.5px/1.5 var(--mono); color: var(--ink-3); }
  .mflag { font:500 10px/1 var(--mono); letter-spacing:.06em; padding:3px 6px; border-radius:2px;
    background: color-mix(in srgb, var(--s5) 18%, transparent); color: var(--s5); white-space:nowrap; }
  .seg { display:inline-flex; gap:0; }
  .seg button { border-radius:0; }
  .seg button:first-child { border-radius:3px 0 0 3px; }
  .seg button:last-child { border-radius:0 3px 3px 0; margin-left:-1px; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--plane); border-color: var(--ink); }
</style>
